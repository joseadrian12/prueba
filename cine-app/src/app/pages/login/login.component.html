<div class="login-container">

  <div class="card login-card shadow">

    <div class="card-body">

      <h3 class="text-center mb-4">
        Cine App
      </h3>

      <div class="mb-3">

        <label class="form-label">
          Usuario
        </label>

        <input type="text" class="form-control" [(ngModel)]="usuario" placeholder="Ingrese usuario">

      </div>


      <div class="mb-3">

        <label class="form-label">
          Contraseña
        </label>

        <input type="password" class="form-control" [(ngModel)]="password" placeholder="Ingrese contraseña">

      </div>


      @if (mensajeError()) {

      <div class="alert alert-danger">
        {{ mensajeError() }}
      </div>

      }


      <button class="btn btn-primary w-100" (click)="iniciarSesion()" [disabled]="cargando()">

        @if (cargando()) {
        Ingresando...
        } @else {
        Iniciar sesión
        }

      </button>

    </div>

  </div>

</div>
